[package]
name = "siwc-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "Fuzz targets for the parsers in siwc that read input from outside"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
siwc = { version = "0.1.0", path = "../crates/siwc", features = ["https", "testing"] }

# Not a member of the crate's workspace: libFuzzer builds only for fuzzing.
[workspace]

[[bin]]
name = "callback"
path = "fuzz_targets/callback.rs"
test = false
doc = false
bench = false

[[bin]]
name = "token_response"
path = "fuzz_targets/token_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "key_set"
path = "fuzz_targets/key_set.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request_head"
path = "fuzz_targets/request_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sealed_entry"
path = "fuzz_targets/sealed_entry.rs"
test = false
doc = false
bench = false

[[bin]]
